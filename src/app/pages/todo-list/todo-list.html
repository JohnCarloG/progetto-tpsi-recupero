<h2>Elenco todo</h2>

<p>
  <input #nuovo placeholder="Nuovo todo" />
  <button (click)="aggiungi(nuovo.value); nuovo.value = ''">Aggiungi</button>
</p>

<p>
  <input placeholder="Cerca…" (input)="cerca.set($any($event.target).value)" />
</p>

<p>Mostrati {{ filtrati().length }} su {{ service.todos().length }} · completati {{ completati() }}</p>

@if (service.loading()) {
  <p>Caricamento…</p>
}
@if (service.error()) {
  <p class="errore">{{ service.error() }}</p>
}

<ul>
  @for (todo of filtrati(); track $index) {
    <li [class.fatto]="todo.completed">
      <a [routerLink]="['/todos', todo.id]">{{ todo.id }}. {{ todo.title }}</a>
    </li>
  }
</ul>
